name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.xml

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every module parses
        run: for f in assets/js/glass/*.js tools/demo/web/app.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: The committed stylesheet matches the sources
        run: |
          npx --yes sass@1.108.2 --no-source-map --style=expanded --quiet scss/glass.scss assets/css/glass.css
          git diff --exit-code assets/css
